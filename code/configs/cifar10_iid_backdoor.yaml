aggregator:
  alpha: 0.5
  server_lr: 1.0
  server_sigma: 0.001
backdoor:
  client_id: 3
  enabled: true
  patch_size: 4
  patch_value: 2.5
  rounds_before_erasure: 40
  target_label: 9
baselines:
  federaser_lr_calib: 0.5
  fedmemprune_include_head: true
  fedmemprune_quantile: 0.95
  fedmemprune_reset_scale: 0.0
  fedrecovery_delta: 1.0e-05
  fedrecovery_eps: 1.0
  fedrecovery_eta: 1.0
  fedrecovery_weighting: linear
  halimi_ascent_lr: 0.005
  halimi_ascent_steps: 50
  halimi_radius: 3.0
  history_stride: 5
  participation_rho: 0.1
  sifu_target_eps: 1.0
dataset:
  dirichlet_alpha: 10.0
  name: cifar10
  num_clients: 100
  num_tasks: 5
evaluation:
  checkpoint_every: 1
  evaluate_every: 10
experiment:
  data_root: ./data
  device: auto
  name: cifar10_iid_backdoor
  seed: 0
federated:
  batch_size: 32
  client_sample_frac: 0.2
  clip_norm: 50.0
  local_epochs: 3
  lr: 0.02
  rounds_per_task: 40
  total_rounds: 200
model:
  in_channels: 3
  name: resnet18
  small_input: true
output:
  checkpoint_dir: ./runs/cifar10_iid_backdoor
summary:
  delta: 1.0e-05
  enabled: true
  eps: 2.0
  frequency: 20
  type: moments
unlearning:
  ascent_step: 0.1
  forward_forgetting:
    delta_1: 1.0e-05
    rho: 0.1
  head_only: true
  projection_radius: 0.5
