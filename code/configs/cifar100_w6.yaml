aggregator:
  alpha: 0.9
  server_lr: 1.0
  server_sigma: 0.001
baselines:
  federaser_lr_calib: 0.5
  fedmemprune_include_head: true
  fedmemprune_quantile: 0.95
  fedmemprune_reset_scale: 0.0
  fedrecovery_delta: 1.0e-05
  fedrecovery_eps: 1.0
  fedrecovery_eta: 1.0
  fedrecovery_weighting: linear
  halimi_ascent_lr: 0.005
  halimi_ascent_steps: 50
  halimi_radius: 3.0
  history_stride: 5
  participation_rho: 0.1
  sifu_target_eps: 1.0
dataset:
  dirichlet_alpha: 0.5
  name: cifar100
  num_clients: 100
  num_tasks: 10
evaluation:
  checkpoint_every: 25
  evaluate_every: 25
experiment:
  data_root: ./data
  device: auto
  name: cifar100_w6
  seed: 0
federated:
  batch_size: 32
  client_sample_frac: 0.1
  clip_norm: 50.0
  local_epochs: 2
  lr: 0.01
  rounds_per_task: 50
  total_rounds: 500
model:
  in_channels: 3
  name: resnet18
  small_input: true
output:
  checkpoint_dir: runs/cifar100_w6
summary:
  delta: 1.0e-05
  enabled: true
  eps: 2.0
  frequency: 20
  type: logits
unlearning:
  ascent_step: 0.0316
  forward_forgetting:
    delta_1: 1.0e-05
    rho: 0.1
  head_only: true
  projection_radius: 0.5
